name: Hiremory worker

# Free background sender: runs on a schedule and can be triggered by hand.
# GitHub Actions cron is best-effort (may lag a few minutes under load).
on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Log only, send nothing"
        type: boolean
        default: true

concurrency:
  group: hiremory-worker
  cancel-in-progress: false   # never run two senders at once

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r worker/requirements.txt

      - name: Run worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MAILBOX_ENC_KEY: ${{ secrets.MAILBOX_ENC_KEY }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          # manual runs default to dry-run; the cron schedule sends for real
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}
        run: python worker/main.py
